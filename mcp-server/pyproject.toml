[project]
name = "dev-workspace-mcp"
version = "0.1.0"
description = "MCP server for Dev Workspace — Cursor talks to DW via tools instead of raw API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0.0",
    "httpx>=0.27.0",
    "pypdf>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dev_workspace_mcp"]
