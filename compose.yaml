services:
  app:
    platform: linux/amd64
    container_name: dev_workspace_app_local
    env_file:
      - .env
    build:
      context: .
      dockerfile: Dockerfile
      target: deps
    restart: unless-stopped
    ports:
      - "3010:3000"
    environment:
      - NODE_ENV=development
      - WORKSPACE_CONFIG_PATH=/data/config.json
      - WORKSPACE_LOCAL_PROJECTS_ROOT=${WORKSPACE_LOCAL_PROJECTS_ROOT}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - .:/app
      - ./workspace_data:/data
      - ${WORKSPACE_LOCAL_PROJECTS_ROOT}:/local-projects:ro
      - /app/node_modules
      - /app/.next
