services:
  app:
    platform: linux/amd64
    container_name: dev_workspace_app_local
    build:
      context: .
      dockerfile: Dockerfile
      target: deps
    restart: unless-stopped
    ports:
      - "${WORKSPACE_DEV_PORT:-3010}:3000"
    environment:
      - NODE_ENV=development
      - WORKSPACE_CONFIG_PATH=/data/config.json
      - WORKSPACE_LOCAL_PROJECTS_ROOT=${WORKSPACE_LOCAL_PROJECTS_ROOT}
    volumes:
      - .:/app
      - ./workspace_data:/data
      - ${WORKSPACE_LOCAL_PROJECTS_ROOT}:/local-projects:ro
      - /app/.next
    command: sh -c "npm install && npm run dev"
