services:
  app:
    platform: linux/amd64
    container_name: dev_workspace_app_production
    env_file:
      - .env
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: ghcr.io/davirezendemota/dev-workspace:latest
    pull_policy: if_not_present
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - WORKSPACE_CONFIG_PATH=/data/config.json
      - WORKSPACE_LOCAL_PROJECTS_ROOT=${WORKSPACE_LOCAL_PROJECTS_ROOT}
      - DATABASE_URL=${DATABASE_URL:-postgresql://dev_workspace:dev_workspace@postgres:5432/dev_workspace}
      - AI_EMBEDDING_PROVIDER=${AI_EMBEDDING_PROVIDER:-openai}
      - AI_EMBEDDING_MODEL=${AI_EMBEDDING_MODEL:-text-embedding-3-small}
      - AI_EMBEDDING_API_TOKEN=${AI_EMBEDDING_API_TOKEN:-}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./workspace_data:/data
      - ${WORKSPACE_LOCAL_PROJECTS_ROOT}:/local-projects:ro

  mcp:
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
    container_name: dev_workspace_mcp_production
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    ports:
      - "${MCP_HOST_PORT:-3001}:8000"
    environment:
      - DEV_WORKSPACE_URL=http://app:3000
      - WORKSPACE_CONFIG_PATH=/data/config.json
      - WORKSPACE_API_TOKEN=${WORKSPACE_API_TOKEN:-}
    volumes:
      - ./workspace_data:/data:ro
    env_file:
      - .env

  postgres:
    image: pgvector/pgvector:pg16
    container_name: dev_workspace_postgres_production
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dev_workspace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_workspace}
      POSTGRES_DB: ${POSTGRES_DB:-dev_workspace}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
