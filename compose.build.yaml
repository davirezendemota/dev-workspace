services:
  app:
    platform: linux/amd64
    container_name: dev_workspace_app_build
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    restart: unless-stopped
    ports:
      - "${WORKSPACE_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - WORKSPACE_CONFIG_PATH=/data/config.json
      - WORKSPACE_LOCAL_PROJECTS_ROOT=${WORKSPACE_LOCAL_PROJECTS_ROOT}
    volumes:
      - ./workspace_data:/data
      - ${WORKSPACE_LOCAL_PROJECTS_ROOT}:/local-projects:ro
